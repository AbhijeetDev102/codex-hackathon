name: failure-investigator

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: failure_investigator
      POSTGRES_USER: failure_investigator
      POSTGRES_PASSWORD: failure_investigator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failure_investigator -d failure_investigator"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-replay}
      FIXTURES_DIR: /fixtures
      DATABASE_URL: postgresql+psycopg://failure_investigator:failure_investigator@postgres:5432/failure_investigator
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-ReverseBusinessFailure contact@example.com}
      EXA_API_KEY: ${EXA_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_CHAT_MODEL: ${SARVAM_CHAT_MODEL:-sarvam-105b}
      SARVAM_STT_MODEL: ${SARVAM_STT_MODEL:-saaras:v4}
      SARVAM_TTS_MODEL: ${SARVAM_TTS_MODEL:-bulbul:v4-flash}
      SARVAM_TTS_SPEAKER: ${SARVAM_TTS_SPEAKER:-}
    ports:
      - "8000:8000"
    volumes:
      - ./fixtures:/fixtures:ro
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
